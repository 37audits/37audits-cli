name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5+; Node 22 bundles npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Build before publish: npm validates "bin" against the files on disk
      # before prepack runs and silently drops it when dist/ is missing.
      - run: npm run build
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
      - name: Determine npm dist-tag
        id: npm-tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            PRERELEASE="${TAG#v[0-9]*.[0-9]*.[0-9]*-}"
            echo "tag=${PRERELEASE%%[-.]*}" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing (OIDC): no npm token. The trusted publisher on
      # npmjs.com must grant the "publish" permission, not only "stage publish".
      - run: npm publish --provenance --access public --tag ${{ steps.npm-tag.outputs.tag }}
